# ============================================================
# 模板3：米黄手帐风
# 米黄色无网格纸、粗笔画（毛笔楷书 马善政）、黑/粉/橙三色笔按章节轮换、
# 重点字蓝/红荧光波浪线下划、代码块行首荧光五角星、整行微倾。
# 用法：python3 md2handwrite.py 笔记.md -c presets/cream-memo.yaml
# ============================================================

font:
  path: fonts/MaShanZheng-Regular.ttf     # 毛笔楷书（笔画自带粗度）
  em: 27.6
  line_height: 1.3
  heading_px: { h1: 38.4, h2: 32.4, h3: 27.6, h4: 26.4, code: 24 }

ink:
  black: [30, 25, 20]                     # 暖黑（配米黄纸）
  red: [178, 34, 34]
  alpha_jitter: [0.78, 1.0]
  texture_strength: 0.6
  texture_sigma: 60
  texture_blur: 1
  pressure: 0.15
  pen_palette:                            # 三色笔按章节轮换
    - [30, 25, 20]                        # 暖黑
    - [214, 78, 132]                      # 粉
    - [240, 130, 32]                      # 橙

glyph:
  stroke_width: 3                         # 笔画加粗（描边）
  line_tilt_deg: [-1.6, -0.4]             # 整行微倾
  bridge: { enabled: true, gap_px: 12, min_area: 6 }
  close_px: 3

emphasis:
  style: wavy                             # 重点字蓝/红手绘波浪线下划
  colors:
    - [66, 133, 244]                      # 蓝
    - [234, 67, 53]                       # 红
  star_rate: 0.22
  star_colors:
    - [66, 133, 244]
    - [234, 67, 53]

paper:
  color: [250, 246, 228]                  # 米黄纸
  grid_enabled: false                     # 无网格
  grid_line: '#e4dccb'
  field: { block: 380, amp: 0 }
  bands: { count: [0, 0] }
  noise:
    grain_enabled: false
    stains: { count: [0, 0] }

watermark: ''                           # 模板不使用扫描水印（页码保留）

page:
  margins_mm: { top: 16, bottom: 18, left: 18, right: 18 }
  wrap_x: 600
